<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HCI Key Press Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1 class="title">⚡ Reaction Test</h1>

        <div class="status">
            <p id="attemptDisplay">Attempt: 0 / 5</p>
            <p id="messageDisplay">Press SPACE to start</p>
        </div>

        <div class="game-box">
            <h1 id="character">?</h1>
        </div>

        <div class="controls">
            <div class="control">Press <b>A</b> → Letter</div>
            <div class="control">Press <b>SPACE</b> → Start</div>
            <div class="control">Press <b>L</b> → Number</div>
        </div>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
